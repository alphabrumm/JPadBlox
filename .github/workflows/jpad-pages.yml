name: JPad bauen und veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build-jpad
      # Zum Herunterladen für den eigenen Webspace
      - uses: actions/upload-artifact@v4
        with: { name: j-pad-webspace, path: dist-jpad, include-hidden-files: true, retention-days: 30 }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-jpad }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Zusätzlich direkt auf den eigenen Webspace (z. B. Alfahosting) per FTP.
  # Läuft nur, wenn die Secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD und FTP_DIR angelegt sind.
  # Übertragen werden nur geänderte Dateien (Merkdatei .ftp-deploy-sync-state.json im Zielordner).
  webspace:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: webspace
      cancel-in-progress: false
    steps:
      - id: check
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          if [ -n "$S" ] && [ -n "$U" ] && [ -n "$P" ] && [ -n "$D" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "FTP-Secrets fehlen – Upload auf den Webspace wird übersprungen."
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with: { name: j-pad-webspace, path: dist-jpad }
      - if: steps.check.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist-jpad/
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          log-level: standard
