name: JPadBlox bauen und veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build-jpad
      # Zum Herunterladen für den eigenen Webspace
      - uses: actions/upload-artifact@v4
        with: { name: j-pad-webspace, path: dist-jpad, include-hidden-files: true, retention-days: 30 }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-jpad }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
